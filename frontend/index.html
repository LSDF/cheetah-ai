<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheetah AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #f97316;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
    }
    .logo span { color: var(--accent); }
    .mode-toggle {
      display: flex;
      gap: 8px;
      background: var(--surface);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #000;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 780px;
      line-height: 1.6;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 0.95rem;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #000;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .input-area {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
    }
    .input-box {
      display: flex;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
    }
    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      min-height: 52px;
      max-height: 140px;
    }
    textarea:focus { border-color: var(--accent); }
    button.send {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 0 22px;
      font-weight: 600;
      cursor: pointer;
    }
    button.send:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">CHEETAH<span> AI</span></div>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="private">Private</button>
      <button class="mode-btn" data-mode="public">Public</button>
    </div>
  </header>

  <div id="chat"></div>

  <div class="input-area">
    <div class="status" id="status">Ready · Self-improving agent online</div>
    <div class="input-box">
      <textarea id="input" placeholder="Talk to Cheetah AI..." rows="1"></textarea>
      <button class="send" id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    let sessionId = localStorage.getItem('cheetah_session') || null;
    let mode = 'private';

    // Mode toggle
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
      });
    });

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = content;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;

      addMessage('user', text);
      input.value = '';
      sendBtn.disabled = true;
      status.textContent = 'Thinking...';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId, mode })
        });
        const data = await res.json();
        if (data.session_id) {
          sessionId = data.session_id;
          localStorage.setItem('cheetah_session', sessionId);
        }
        addMessage('assistant', data.reply);
        status.textContent = 'Ready · Self-improving agent online';
      } catch (err) {
        addMessage('assistant', 'Connection error. Make sure the backend is running on port 8000.');
        status.textContent = 'Backend offline';
      }
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
